<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <rect x="70" y="60" width="1260" height="780" rx="20" fill="url(#card)" filter="url(#shadow)"/>

  <rect x="110" y="110" width="540" height="54" rx="12" fill="#24292f"/>
  <text x="140" y="146" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">GitHub Actions</text>
  <rect x="1170" y="110" width="120" height="36" rx="18" fill="#2ea043"/>
  <text x="1195" y="133" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Success</text>

  <rect x="110" y="210" width="1180" height="120" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="255" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#24292f">Build Android APK</text>
  <text x="140" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#57606a">workflow run on push to main • 4 min 18 sec</text>
  <rect x="140" y="315" width="220" height="26" rx="13" fill="#0969da"/>
  <text x="188" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Run workflow</text>

  <rect x="110" y="390" width="560" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="145" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#24292f">Job steps</text>

  <rect x="145" y="455" width="490" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="170" cy="478" r="9" fill="#2ea043"/>
  <text x="190" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#24292f">Checkout Code</text>

  <rect x="145" y="520" width="490" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="170" cy="543" r="9" fill="#2ea043"/>
  <text x="190" y="551" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#24292f">Build APK with Buildozer</text>

  <rect x="145" y="585" width="490" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="170" cy="608" r="9" fill="#2ea043"/>
  <text x="190" y="616" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#24292f">Upload APK Artifact</text>

  <rect x="710" y="390" width="580" height="310" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="745" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#24292f">Artifact</text>
  <rect x="745" y="465" width="510" height="160" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="780" y="500" width="110" height="110" rx="12" fill="#e1f9eb"/>
  <path d="M820 535 L850 565 L890 520" stroke="#1a7f37" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="925" y="548" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#24292f">WhatsAppBlaster-APK</text>
  <text x="925" y="585" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#57606a">downloadable artifact</text>
  <text x="925" y="618" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#57606a">generated by Buildozer</text>

  <rect x="745" y="650" width="220" height="28" rx="14" fill="#0969da"/>
  <text x="790" y="669" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Download APK</text>

  <text x="110" y="770" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#24292f">GitHub Actions workflow creates the Android package automatically</text>
</svg>
